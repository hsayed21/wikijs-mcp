name: Release

on:
  #push:
  #  branches:
  #    - main
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version bump for the release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      # update_latest:
      #   description: Update the latest release instead of creating a new one
      #   required: true
      #   default: true
      #   type: boolean
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checking
        run: npm run typecheck

      - name: Create GitHub and npm release
        uses: hsayed21/release-action@v1
        with:
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'patch' }}
          initial-version: '2.0.1'
          generate-changelog: true
          # update-latest-release: ${{ inputs.update_latest }}
          node-version: '22'
          release-command-shell: bash
          release-command: |
            npm ci
            npm run build
            mkdir -p artifacts
            npm pack --pack-destination artifacts
            if npm view "@hsayed21/wikijs-mcp@$RELEASE_VERSION" version > /dev/null 2>&1; then
              echo "@hsayed21/wikijs-mcp@$RELEASE_VERSION is already published; skipping npm publish."
            else
              npm publish ./artifacts/*.tgz --access public
            fi
          files-pattern: artifacts/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
